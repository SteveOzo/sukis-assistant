name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitarios
        run: ./gradlew testReleaseUnitTest --no-daemon --stacktrace

      - name: Compilar APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk sukis-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sukis-apk
          path: sukis-${{ github.run_number }}.apk

      - name: Publicar release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sukis 1.0.${{ github.run_number }}
          body: |
            APK de Sukis generada automáticamente desde ${{ github.sha }}.
            Descarga `sukis-${{ github.run_number }}.apk` desde la tablet e instálala.
          files: sukis-${{ github.run_number }}.apk
          make_latest: true
